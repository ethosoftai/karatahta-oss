<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kara Tahta şifreni yenile</title>
  </head>
  <body style="margin:0;padding:0;background:#08090a;color:#f7f8f8;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#08090a;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#0f1011;border:1px solid #25272b;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:34px 34px 16px;text-align:center;">
                <img src="https://karatahta.ethosoft.org/logo.png" width="210" alt="Kara Tahta" style="display:block;max-width:100%;height:auto;margin:0 auto;">
              </td>
            </tr>
            <tr>
              <td style="padding:12px 34px 36px;">
                <p style="margin:0 0 10px;color:#8f96a3;font-size:12px;letter-spacing:1.4px;text-align:center;">ŞİFRE YENİLEME</p>
                <h1 style="margin:0;color:#f7f8f8;font-size:27px;line-height:1.25;text-align:center;">Yeni bir şifre belirle.</h1>
                <p style="margin:16px 0 26px;color:#a9aeb8;font-size:15px;line-height:1.65;text-align:center;">
                  Kara Tahta hesabının şifresini değiştirmek için aşağıdaki güvenli bağlantıyı aç.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 auto;">
                  <tr>
                    <td style="border-radius:8px;background:#5e6ad2;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">Şifremi yenile</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;color:#717680;font-size:12px;line-height:1.55;text-align:center;">
                  Bu isteği sen yapmadıysan bağlantıya tıklama; mevcut şifren değişmeyecek.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:18px 0 0;color:#555b65;font-size:11px;">Kara Tahta · ethosoft.org</p>
        </td>
      </tr>
    </table>
  </body>
</html>
